# Configuration defaults for the Seeed Studios XIAO S3

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
    board_build.mcu: esp32s3
    board_build.extra_flags:
    - "-DARDUINO_HW_CDC_ON_BOOT=0"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Xiao ESP32-S3 uses GPIO43/GPIO44 for UART0. CN105 is on those pins here,
# so the logger must not use UART0.
uart:
  id: HP_UART
  baud_rate: 2400
  tx_pin: GPIO43
  rx_pin: GPIO44

  # Enable logging over USB; UART0 is reserved for CN105.
logger:
  hardware_uart: USB_CDC
  level: INFO
  logs:
    EVT_SETS : INFO
    WIFI : INFO
    MQTT : INFO
    WRITE_SETTINGS : INFO
    SETTINGS : INFO
    STATUS : INFO
    CN105Climate: INFO
    CN105: INFO
    CYCLE: WARN # Set this to INFO to see how long your cycle times are taking
    climate: WARN
    sensor: INFO
    chkSum : INFO
    WRITE : WARN
    READ : WARN
    Header: INFO
    Decoder : INFO
    CONTROL_WANTED_SETTINGS: INFO
